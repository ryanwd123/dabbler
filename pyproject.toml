

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dabbler"  # Required
description = "A qt-gui tool to view database tables/queries integrated within an jupyter/ipython session"
authors = [{name = "Ryan DeWitt", email = "ryan.w.dewitt@gmail.com"}]
dynamic = ["version"]
keywords = ["DuckDB", "SQL", "autocomplete", "intellisense", "lsp", "language server", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
license = {file = "LICENSE.txt"}

# what the language server needs; the IPython extension and its window need [gui]
dependencies = [
  "duckdb>=1.1",
  "lark>=1.2",
  "pygls>=2.0,<3",
  "sqlglot",
]

[project.optional-dependencies]
gui = [
  "ipython",
  "ipykernel",
  "qtpy",
  "PySide6-Essentials",
  "polars",
  "pyarrow",  # DuckDB's .pl() goes through arrow
  "pygments",
]
excel = ["xlsxwriter"]  # export to .xlsx from the window
test = ["pytest", "pytest-lsp>=1.0", "pytest-asyncio", "pandas"]





[project.readme]
text = """
An IPython extension and SQL language server for DuckDB SQL written inside python files. This project is a work in progress and there could be bugs.

Main Features:
- A window to view tables and query results from an IPython session: `pip install "dabbler[gui]"`, then `%load_ext dabbler.ext`
- Completions, signature help, hover docs and syntax errors for SQL in python files, from the session's schema or a DuckDB database file (`# dabbler use 'file.duckdb'`); needs the "dabbler" VS Code extension and `pip install dabbler`

More: https://github.com/ryanwd123/dabbler
"""
content-type = "text/markdown"



[tool.setuptools.dynamic]
version = {attr = "dabbler.__version__"}

[project.urls]
Homepage = "https://github.com/ryanwd123/dabbler"


[tool.setuptools]
packages = ["dabbler","dabbler.lsp"]

[tool.setuptools.package-data]
"*" = ["*.lark", "*.json"]

[tool.pytest.ini_options]
testpaths = ["dabbler_py_tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools", "scripts"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dabbler/gui_qt.py" = ["F401"]  # re-exports the Qt binding

[tool.pyrefly]
project-includes = ["dabbler"]
preset = "default"
python-version = "3.12"
