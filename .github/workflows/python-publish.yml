name: Build and Publish to PyPI

# Publishing a GitHub release tagged e.g. v0.9.0 builds that commit as version
# 0.9.0 and uploads it. Bump dabbler/__init__.py (scripts/version.py) and commit
# before tagging; the build checks that the tag and the version agree.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build
      run: python -m pip install --upgrade pip build

    - name: Check the tag matches dabbler.__version__
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('dabbler/__init__.py').read()).group(1))")
        if [ "$tag" != "$version" ]; then
          echo "release tag $GITHUB_REF_NAME doesn't match __version__ $version"
          exit 1
        fi

    - name: Build package
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
