name: VS Code extension

# Type-checks, lints and packages the extension, and uploads the .vsix as a
# build artifact. Pushing a tag like vsc-v0.0.9 also publishes it to the
# marketplace (needs a VSCE_PAT secret); bump with dabbler_vsc_ext/version.py
# and commit before tagging.
on:
  push:
    branches: [master]
    tags: ["vsc-v*"]
    paths: ["dabbler_vsc_ext/**", ".github/workflows/vscode-extension.yml"]
  pull_request:
    paths: ["dabbler_vsc_ext/**", ".github/workflows/vscode-extension.yml"]

defaults:
  run:
    working-directory: dabbler_vsc_ext

jobs:
  package:
    name: build .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dabbler_vsc_ext/package-lock.json

      - run: npm ci
      - run: npm run compile
      - run: npm run lint

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/vsc-v')
        run: |
          tag="${GITHUB_REF_NAME#vsc-v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: dabbler-vsix
          path: dabbler_vsc_ext/*.vsix

      - name: Publish to the marketplace
        if: startsWith(github.ref, 'refs/tags/vsc-v')
        run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
